name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Project
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP bulunamadı!"
            exit 1
          fi

          echo "ZIP: $ZIP"

          unzip -q "$ZIP" -d extracted

          echo "Extracted:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Gradle Project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find extracted -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: ZIP içinde gradlew bulunamadı!"
            echo "ZIP içeriği:"
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project:"
          echo "$PROJECT_DIR"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          chmod +x gradlew

          java -version
          ./gradlew --version

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Check APK
        shell: bash
        run: |
          set -e

          APK=$(find extracted \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK oluşturulmadı!"
            exit 1
          fi

          echo "APK bulundu:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoxNo-debug-apk
          path: "extracted/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
