name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP bulunamadı!"
            exit 1
          fi

          echo "ZIP: $ZIP"
          unzip -q "$ZIP" -d extracted

      - name: Select NoxNo Project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="extracted/NoxNo-main"

          echo "Project: $PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: Ana gradlew bulunamadı!"
            echo "Bulunan gradlew dosyaları:"
            find extracted -type f -name "gradlew" -print
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Check Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          java -version
          ./gradlew --version

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK oluşturulamadı!"
            exit 1
          fi

          echo "APK bulundu:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoxNo-debug-apk
          path: "extracted/NoxNo-main/**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
